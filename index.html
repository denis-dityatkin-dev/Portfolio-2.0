<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
	<link rel="icon" href="favicon.png" type="image/png">
  <link rel="stylesheet" href="css/reset.css">
  <link rel="stylesheet" href="css/main.css">
  <title>Portfolio-2.0</title>
</head>
<body>
	<div class="wrapper">
		<header id="navbar" class="header">
					<div class="header__container">
					<a href="#" class="header__logo">Denis</a>
					<div class="header__menu menu">
							<nav id="menu" class="menu__body">
								<ul class="menu__list">
									<li class="menu__item">
										<a data-goto=".wrapper" href="#" class="menu__link">
											<span>#</span><span data-i18n="nav.home">home</span>
										</a>
									</li>
									<li class="menu__item">
										<a data-goto=".works" href="#" class="menu__link">
											<span>#</span><span data-i18n="nav.works">works</span>
										</a>
									</li>
									<li class="menu__item">
										<a data-goto=".about" href="#" class="menu__link">
												<span>#</span><span data-i18n="nav.about">about-me</span>
										</a>
									</li>
									<li class="menu__item">
										<a data-goto=".contacts" href="#" class="menu__link">
											<span>#</span><span data-i18n="nav.contacts">contacts</span>
										</a>
									</li>
									<li class="menu__item">
										<div class="select-wrapper">
											<select id="lang-select" class="menu__link menu__link-select">
												<option value="en">EN</option>
												<option value="ru">RU</option>
												<option value="uk">UA</option>
											</select>
										</div>
									</li>
								</ul>
							</nav>
						</div>
						<div class="header__actions">
							<button type="button" class="menu__icon icon-menu"><span></span></button>
						</div>
				</div>
		</header>
		<main class="main">
			<section class="main-section main-section--anim">
				<div class="main-section__social social">
					<div class="social__item icon-github"></div>
					<div class="social__item icon-dribble"></div>
					<div class="social__item icon-figma"></div>
				</div>
				<div class="main-section__container">
					<div class="main-section__content">
						<h1 class="main-section__title">Denis is a <span>web designer</span> and <span>front-end developer</span></h1>
						<div class="main-section__text">
							<p>He crafts responsive websites where technologies meet creativity</p>
						</div>
						<button class="button main-section__button button__live">Contact me!!</button>
					</div>
					<div class="main-section__decor decor-main-section">
						<div class="decor-main-section__box">
							<div class="decor-main-section__image">
								<img class="decor-main-section__picture" src="./images/main/denis.png" alt="Denis">
							</div>
							<h2 class="decor-main-section__subtitle icon-cube-primary">Currently working on <span>Portfolio</span></h2>
						</div>
					</div>
				</div>
			</section>
		</main>
		<footer class="footer">
		</footer>
	</div>
  <script src="js/translate.js"></script>
  <script src="js/components/burger.js"></script>
	<!-- <script src="https://cdn.jsdelivr.net/npm/swiper@8/swiper-bundle.min.js"></script>
	<script src="js/components/slider_swiper.js"></script> -->
	<!-- <script src="js/components/anim.js"></script> -->
</body>
</html>
